name: Build sheng iPadOS 27
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Build stage
        type: choice
        options: [boot, both, root]
        default: boot
      data_generation:
        description: First-install Data seed cache group
        type: string
        default: sheng-development-1
  push:
    tags: ['build-*']

permissions:
  contents: read

jobs:
  storage-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: |
          python3 configure.py --fetch --minimal
          python3 audit_target.py --patches
          python3 -m unittest discover -s tests -v
          g++ -std=c++17 -Isrc/UniXNU-sheng/drivers/ShengUfs tests/storage.cpp -lcrypto -o "$RUNNER_TEMP/storage"
          "$RUNNER_TEMP/storage"
          bash -n build.sh

  root:
    if: inputs.stage != 'boot'
    needs: storage-tests
    runs-on: macos-26
    timeout-minutes: 180
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      UNIXNU_IPSW_JOBS: '12'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: brew install blacktop/tap/ipsw zstd
      - name: Build and check original OS and SystemOS windows
        run: bash build.sh root
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sheng-24A446-linux-root
          path: dist/root/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  boot:
    if: inputs.stage != 'root'
    needs: storage-tests
    runs-on: macos-26
    timeout-minutes: 360
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      UNIXNU_IPSW_JOBS: '12'
      UNIXNU_UNIQUE_CHIP_ID: '53483653'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SHENG_DATA_GENERATION: ${{ inputs.data_generation || 'sheng-development-1' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Apple and UEFI build tools
        run: |
          xcodebuild -version
          brew install dtc llvm lld llvm@22 lld@22 cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup unifdef openssl@3 zstd blacktop/tap/ipsw
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          mkdir -p "$RUNNER_TEMP/edk2-llvm"
          for tool in clang llvm-lib llvm-rc; do ln -s "$(brew --prefix llvm@22)/bin/$tool" "$RUNNER_TEMP/edk2-llvm/$tool"; done
          ln -s "$(brew --prefix lld@22)/bin/lld-link" "$RUNNER_TEMP/edk2-llvm/lld-link"
          echo "CLANG_BIN=$RUNNER_TEMP/edk2-llvm/" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
      - name: Prepare pinned iPadOS inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 configure.py --fetch
          python3 audit_target.py
          python3 src/UniXNU-sheng/scripts/extract-files.py
          python3 ci_build.py prepare
          printf '| Stage | Result | Time |\n|---|---|---:|\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Adreno Metal and Turnip
        uses: ./.github/actions/checkpoint
        with: {stage: gpu}
      - name: iPadOS runtime and Data
        uses: ./.github/actions/checkpoint
        with: {stage: runtime}
      - name: XNU objects and device driver archives
        env:
          GITHUB_TOKEN: ${{ github.token }}
        uses: ./.github/actions/checkpoint
        with: {stage: archives}
      - name: RELEASE LTO reference
        env:
          GITHUB_TOKEN: ${{ github.token }}
        uses: ./.github/actions/checkpoint
        with: {stage: reference}
      - name: Link DEVELOPMENT kernel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        uses: ./.github/actions/checkpoint
        with: {stage: link}
      - name: Prelink iPadOS kernel
        uses: ./.github/actions/checkpoint
        with: {stage: prelink}
      - name: Build UniXNU EFI package
        uses: ./.github/actions/checkpoint
        with: {stage: package}
      - name: Assemble payload
        uses: ./.github/actions/checkpoint
        with: {stage: payload}
      - name: Build sheng UEFI firmware
        uses: ./.github/actions/checkpoint
        with: {stage: firmware}
      - name: EDK II ramdisk compressor
        uses: ./.github/actions/checkpoint
        with: {stage: compressor}
      - name: Pack boot image and verify release
        run: |
          python3 ci_build.py finish
          bash build.sh export-boot
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sheng-24A446-boot
          path: dist/boot/
          if-no-files-found: error
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: boot-diagnostics
          path: src/UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/logs/*.log
          if-no-files-found: ignore
          retention-days: 7
